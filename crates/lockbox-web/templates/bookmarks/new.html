{% extends "layout.html" %}

{% block title %}lockbox: new bookmark{% endblock %}

{% block subnav %}
<nav class="subtabs">
    <a class="subtab on" href="/bookmarks">saved</a>
    <a class="subtab" href="/bookmarks/archived">archived</a>
    <a class="subtab" href="/folders">folders</a>
    <a class="subtab" href="/topics">topics</a>
</nav>
{% endblock %}

{% block content %}
<div class="sectionbar">
    <h1 class="section"><a href="/bookmarks">bookmarks</a></h1>
</div>

{%- if has_error %}
<p class="notice">{{ error }}</p>
{%- endif %}

<form class="stack" method="post" action="/bookmarks">
    <label>address <input type="text" name="url" size="42" required
            placeholder="https://example.com/article"></label>
    <label>title <input type="text" name="title" size="42" placeholder="falls back to the address"></label>
    <label>note <textarea name="note" rows="3"></textarea></label>
    <label>folder
        <select name="folder_id">
            <option value="">unfiled</option>
            {%- for folder in save_folders %}
            <option value="{{ folder.id }}">{{ folder.label }}</option>
            {%- endfor %}
        </select>
    </label>
    <label>topics <input type="text" name="topics" size="32" placeholder="rust, databases"></label>
    <label>visibility
        <select name="visibility">
            <option value="public" {% if visibility_public %}selected{% endif %}>public</option>
            <option value="private" {% if visibility_public %}{% else %}selected{% endif %}>private</option>
        </select>
    </label>
    <div class="actions">
        <button type="submit">save</button>
        <a class="button" href="/bookmarks">cancel</a>
    </div>
</form>
{% endblock %}
