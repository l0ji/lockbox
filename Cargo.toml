[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lockboxd", "crates/lockbox-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
askama = "0.16.0"
axum = "0.8.9"
bech32 = "0.11.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9.1", default-features = false, features = ["client"] }
iroh = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

lockbox-core = { path = "crates/lockbox-core" }
lockbox-proto = { path = "crates/lockbox-proto" }
lockbox-store = { path = "crates/lockbox-store" }
